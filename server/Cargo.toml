[package]
name = "fossall-server"
version = "0.1.0"
edition = "2021"
default-run = "fossall-server"

[dependencies]
anyhow = "1"
axum = "0.8"
maud = { version = "0.27", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
cookie = { version = "0.18.2", features = ["private", "percent-encode", "key-expansion"] }
sha2 = "0.11.1"
base64 = "0.23.1"
rand = "0.10.3"
url = "2.5.8"
